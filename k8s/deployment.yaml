---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmacy-api

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: pharmacy-api

  template:
    metadata:
      labels:
        app: pharmacy-api

    spec:
      serviceAccountName: pharmacy-api
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: pharmacy-api

      containers:
        - name: pharmacy-api
          image: REPLACE_IMAGE_URI
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: AWS_DEFAULT_REGION
              value: "eu-west-2"

            - name: TABLE_NAME
              valueFrom:
                configMapKeyRef:
                  name: pharmacy-api-config
                  key: TABLE_NAME

            - name: EVENT_BUS_NAME
              valueFrom:
                configMapKeyRef:
                  name: pharmacy-api-config
                  key: EVENT_BUS_NAME

            - name: OIDC_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: pharmacy-api-config
                  key: OIDC_ISSUER

            - name: OIDC_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: pharmacy-api-config
                  key: OIDC_CLIENT_ID

            - name: OIDC_TENANT_CLAIM
              valueFrom:
                configMapKeyRef:
                  name: pharmacy-api-config
                  key: OIDC_TENANT_CLAIM

            - name: OIDC_ROLE_CLAIM
              valueFrom:
                configMapKeyRef:
                  name: pharmacy-api-config
                  key: OIDC_ROLE_CLAIM

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
