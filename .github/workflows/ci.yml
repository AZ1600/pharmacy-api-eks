name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: eu-west-2
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_ACCESS_KEY_ID: testing
  AWS_SECRET_ACCESS_KEY: testing

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q app tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  container-validation:
    name: Container validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container
        run: docker build -t pharmacy-api:ci .

      - name: Verify non-root image user
        run: |
          USER_NAME="$(docker image inspect pharmacy-api:ci --format '{{.Config.User}}')"
          echo "Configured user: ${USER_NAME}"
          test "${USER_NAME}" = "appuser"

      - name: Run hardened container
        run: |
          docker run \
            --detach \
            --name pharmacy-api-ci \
            --publish 8000:8000 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --env AWS_DEFAULT_REGION \
            --env AWS_EC2_METADATA_DISABLED \
            --env AWS_ACCESS_KEY_ID \
            --env AWS_SECRET_ACCESS_KEY \
            pharmacy-api:ci

      - name: Wait for health endpoint
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs pharmacy-api-ci
          exit 1

      - name: Verify running user is non-root
        run: |
          docker exec pharmacy-api-ci id
          test "$(docker exec pharmacy-api-ci id -u)" != "0"

      - name: Show container logs
        if: always()
        run: docker logs pharmacy-api-ci || true

  kubernetes-validation:
    name: Kubernetes validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install YAML validator
        run: python -m pip install yamllint==1.37.1

      - name: Validate Kubernetes YAML
        run: yamllint k8s

      - name: Validate Kubernetes schemas
        run: |
          docker run --rm \
            -v "${PWD}:/work" \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict \
            -summary \
            /work/k8s

  security-validation:
    name: Security validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit \
            --requirement requirements.txt \
            --strict

      - name: Build security scan image
        run: docker build -t pharmacy-api:security .

      - name: Scan container for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pharmacy-api:security
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pharmacy-api:security
          format: cyclonedx
          output: pharmacy-api-sbom.cdx.json
          exit-code: "0"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-api-sbom
          path: pharmacy-api-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14